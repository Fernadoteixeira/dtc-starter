name: 360 E2E & Integration CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-unit:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Monorepo
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: "pk_test_dummy"
        run: pnpm run lint

      - name: Discover Backend Unit Tests
        id: discover-unit-tests
        run: |
          count=$(find apps/backend/src -type f -path "*__tests__*" \( -name "*.unit.spec.ts" -o -name "*.unit.spec.js" \) 2>/dev/null | wc -l | tr -d " ")
          echo "unit_test_count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "SKIPPED_NO_TESTS: 0 unit test files discovered. Unit test gate cannot be reported as PASS."
            echo "unit_test_status=SKIPPED_NO_TESTS" >> "$GITHUB_OUTPUT"
          else
            echo "Discovered $count unit test file(s). Proceeding to jest."
          fi

      - name: Run Backend Unit Tests
        id: run-unit-tests
        if: ${{ steps.discover-unit-tests.outputs.unit_test_count != "0" }}
        continue-on-error: true
        run: cd apps/backend && pnpm run test:unit

      - name: Set Unit Test Status
        id: unit-test-status
        if: ${{ always() }}
        run: |
          count="${{ steps.discover-unit-tests.outputs.unit_test_count }}"
          if [ "$count" -eq 0 ]; then
            echo "unit_test_status=SKIPPED_NO_TESTS" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.run-unit-tests.outcome }}" = "success" ]; then
            echo "unit_test_status=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "unit_test_status=FAIL" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit Test Gate Summary
        if: ${{ always() }}
        run: |
          status="${{ steps.unit-test-status.outputs.unit_test_status }}"
          echo "## Unit Test Gate: $status" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = "SKIPPED_NO_TESTS" ]; then
            echo "SKIPPED_NO_TESTS: 0 unit test files discovered. Unit test gate cannot be reported as PASS." >> "$GITHUB_STEP_SUMMARY"
            echo "**Note:** A SKIPPED_NO_TESTS state is NOT a unit-tests-PASS state." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" = "PASS" ]; then
            echo "Unit tests ran and passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unit tests ran and FAILED." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  e2e-playwright:
    name: Playwright E2E Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright E2E Tests
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: "pk_test_dummy"
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "supersecret"
          COOKIE_SECRET: "supersecret"
          STORE_CORS: "http://localhost:8000"
          ADMIN_CORS: "http://localhost:9000"
          AUTH_CORS: "http://localhost:9000"
        run: pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Playwright Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 14
