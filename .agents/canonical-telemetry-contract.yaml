# ──────────────────────────────────────────────────────────────────────────────
# H6.1 / W5 #46 — FIO-VIVO Canonical OpenTelemetry Substrate Contract
# ──────────────────────────────────────────────────────────────────────────────
#
# LAWS & INVARIANTS:
#   1. TELEMETRY TRACKS EXECUTION; TELEMETRY NEVER CONCEDES AUTH
#   2. TELEMETRY LOSS != BEHAVIOR CHANGE (EXPORTER OUTAGE IS FAIL-SAFE)
#   3. OBSERVABILITY != EVIDENCE != AUTH
# ──────────────────────────────────────────────────────────────────────────────

version: 2
kind: canonical-telemetry-contract
status: active
fabric: FIO-VIVO Agentic Fabric
specification: Issue #46 OpenTelemetry Neutral Telemetry Substrate

vendor_neutrality:
  protocol: OpenTelemetry v1.3.0
  export_format: OTLP/gRPC & OTLP/HTTP-JSON
  schema_url: "https://opentelemetry.io/schemas/1.21.0"
  backend_independence:
    adapters_supported: [otlp_collector, langfuse_optional, langsmith_optional, phoenix_optional]
    core_lockin: none

# ──────────────────────────────────────────────────────────────────────────────
# Canonical Identifier Coverage (#46 Complete Identifier Set)
# ──────────────────────────────────────────────────────────────────────────────

canonical_identifiers:
  task_layer:
    - fabric.task_id
    - fabric.task_capsule_digest
  execution_layer:
    - fabric.execution_id
    - fabric.invocation_id
  identity_layer:
    - fabric.principal_id
    - fabric.session_id
    - fabric.agent_id
    - fabric.agent_archetype
  capability_layer:
    - fabric.capability_id
    - fabric.model_id
    - fabric.provider_id
  operation_layer:
    - fabric.operation_type
  artifact_layer:
    - fabric.artifact_id
    - fabric.output_digest
  evidence_auth_layer:
    - fabric.auth_verdict
    - fabric.evidence_receipt_ref
    - fabric.review_verdict
  metrics_cost_layer:
    - fabric.latency_ms
    - fabric.token_count
    - fabric.cost_usd
    - fabric.retries
    - fabric.error_type
  outcome_layer:
    - fabric.outcome_correlation_id

# ──────────────────────────────────────────────────────────────────────────────
# Measurement Hierarchy (#46 6-Layer Hierarchy)
# ──────────────────────────────────────────────────────────────────────────────

measurement_hierarchy:
  layers:
    - name: signal
      description: Raw event log and trace span signals
    - name: step
      description: Bounded execution step telemetry
    - name: execution
      description: Full invocation trace context
    - name: task
      description: Complete task capsule execution metrics
    - name: capability_product
      description: Capability performance and resource consumption
    - name: outcome
      description: Business and verified functional outcome metrics

# ──────────────────────────────────────────────────────────────────────────────
# Tracing & Operation Taxonomy (#46 FV-060)
# ──────────────────────────────────────────────────────────────────────────────

operation_taxonomy:
  categories:
    - llm: "Model inference calls"
    - tool: "Execution of internal/external tools"
    - retrieval: "Knowledge retrieval queries"
    - agent: "Agent sub-task orchestrations"
    - review: "Independent verification and review steps"

tracing:
  tracer_name: "fio-vivo.agentic-fabric"
  spans:
    - name: "fabric.task_capsule.execute"
      description: "Traces complete task capsule execution lifecycle"
      required_attributes:
        - fabric.task_id
        - fabric.task_capsule_digest
        - fabric.execution_id
        - fabric.invocation_id
        - fabric.agent_id
        - fabric.agent_archetype
        - fabric.auth_verdict
        - fabric.evidence_receipt_ref

    - name: "fabric.lease.acquire"
      description: "Traces atomic process-safe lease acquisition"
      required_attributes:
        - fabric.task_id
        - fabric.sanitized_lease_hash
        - fabric.sanitized_fencing_hash

    - name: "fabric.a2a.gateway_request"
      description: "Traces incoming A2A external gateway request"
      required_attributes:
        - fabric.principal_id
        - fabric.session_id
        - fabric.capability_id
        - fabric.auth_verdict

# ──────────────────────────────────────────────────────────────────────────────
# Resilience, Control-Plane Privacy & Fault Isolation (#46 FV-058, FV-062, FV-063)
# ──────────────────────────────────────────────────────────────────────────────

resilience:
  exporter_outage_policy: FAIL_SAFE_CONTINUE_EXECUTION
  telemetry_failure_behavior:
    halts_execution: false
    behavior_change: false
  invariants:
    - OBSERVABILITY != EVIDENCE != AUTH
    - TELEMETRY LOSS != BEHAVIOR CHANGE

privacy_and_control_plane_security:
  forbidden_attributes:
    - "raw_secret"
    - "api_key"
    - "private_key"
    - "raw_prompt"
    - "internal_stack_trace"
  control_plane_id_policy:
    raw_fencing_token_export: FORBIDDEN
    raw_lease_id_export: FORBIDDEN
    sanitization_method: SHA256_HASH_BEFORE_EXPORT

cardinality_budget_policy:
  high_cardinality_rule:
    span_attributes: ALLOWED_UNDER_BOUNDED_RETENTION
    metric_dimensions_labels: STRICTLY_FORBIDDEN
  max_custom_attributes_per_span: 16
  max_attribute_string_length: 256
  unbounded_dimensions: FORBIDDEN
