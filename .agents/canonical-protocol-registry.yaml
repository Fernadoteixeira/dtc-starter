version: 1
kind: canonical-protocol-registry
status: active
repository: Fernadoteixeira/dtc-starter
description: |
  P4 Protocols & FIO-VIVO-AP2 Boundary SSOT for the FIO-VIVO Agentic Fabric.
  Disambiguates FIO-VIVO-AP2 (Internal Agent-to-Platform Protocol) from AP2-Payments (External Agent Payments Protocol).

laws:
  - PROTOCOL != AUTHORITY (Protocols communicate/transact; contracts authorize)
  - A2A does not authorize commits or workspace writes
  - MCP does not authorize payment mandates or releases
  - FIO-VIVO-AP2 regulates agent-to-platform interaction with strict PreToolUse firewall and Stop gate

protocols:
  internal_execution:
    canonical_name: Internal Execution Protocol
    scope: internal-runtime
    contract: .agents/canonical-execution-protocol.yaml
    lib: .agents/scripts/canonical-execution-lib.mjs
    receipts: [ROUTE-E, AGENT-LOAD-E, SKILL-LOAD-E, AGENT-RUN, REVIEW-E, EVID-E]

  mcp_knowledge:
    canonical_name: Model Context Protocol Knowledge Gateway
    scope: external-knowledge
    server: medusa-docs
    endpoint: https://docs.medusajs.com/mcp
    config: .vscode/mcp.json
    usage: Documentation queries for Medusa APIs, modules, workflows, storefront

  internal_a2a:
    canonical_name: FIO-VIVO Internal Agent-to-Agent Protocol
    scope: agent-collaboration
    orchestrator: .agents/fio-vivo-antigravity-rug-pack/.agents/agents/fio-vivo-rug/agent.md
    worker: .agents/fio-vivo-antigravity-rug-pack/.agents/agents/canonical-worker/agent.md
    reviewer: .agents/fio-vivo-antigravity-rug-pack/.agents/agents/canonical-reviewer/agent.md
    rule: Author Agent ID != Reviewer Agent ID (Independent review required)

  fio-vivo-ap2:
    canonical_name: FIO-VIVO Agent-to-Platform Execution Boundary
    scope: internal-platform-governance
    firewall: .agents/scripts/pretool-firewall.ps1
    stop_gate: .agents/scripts/stop-gate.ps1
    protected_paths:
      - apps/storefront/src/app/globals.css
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/*
      - playwright.config.*
      - apps/storefront/src/modules/nos-gallery/*
    blocked_commands:
      - git commit
      - git push
      - git reset
      - git rebase
      - git merge
      - git revert
      - git clean
      - git cherry-pick

  ap2-payments:
    canonical_name: Agent Payments & Mandates Protocol
    scope: external-transaction
    mandate_required: true
    rail: medusa-payment-providers

  external_a2a:
    canonical_name: FIO-VIVO A2A External Interoperability Boundary
    scope: external-agent-collaboration
    normative_spec: A2A Specification v1.0.1 (wire 1.0)
    binding: JSON-RPC 2.0
    content_type: application/a2a+json
    authentication: apiKey (X-FIO-VIVO-A2A-Key)
    remote_auth_ceiling: AUTH-0
    boundary_contract: .agents/a2a-boundary-contract.yaml
    gateway: .agents/scripts/a2a-gateway.mjs
    translator: .agents/scripts/a2a-message-translator.mjs
    sanitizer: .agents/scripts/a2a-evidence-sanitizer.mjs
    projection: .agents/scripts/a2a-discovery-projection.mjs
    adversarial_suite: .agents/scripts/__tests__/a2a-adversarial-corpus.test.mjs
    conformance_status: REMOTE-CERTIFIED
    certification_evidence: .agents/scripts/__tests__/W4-E/

authorization_classes:
  AUTH-0: "Information (Read/Search/Analyze)"
  AUTH-1: "Workspace Mutation (Code/CSS/Files — requires write-set lease)"
  AUTH-2: "SCM (Commit/Push/PR — requires explicit human authorization)"
  AUTH-3: "Release (Deploy/Staging — requires release authorization)"
  AUTH-4: "EXTERNAL_CONSEQUENCE (External side-effects: financial, publication, notification)"

external_consequence_subtypes:
  financial_transaction:
    mandate_protocol: ap2-payments
    mandate_required: true
  external_publication:
    policy_required: true
  external_notification:
    policy_required: true

legacy_compatibility:
  id: protocols.dtc_ap2
  status: deprecated
  emission: forbidden
  read_compatibility: allowed
  canonical_replacement: protocols.fio_vivo_ap2
  removal_condition:
    - zero persisted legacy capsules
    - zero legacy fixtures
    - zero legacy consumers
