version: 1
kind: canonical-agent-shortcut-registry
status: active
repository: Fernadoteixeira/dtc-starter
canonical_agent_root: .agents/ollama-superpowers-pack-v1.0.0/agents
canonical_skill_root: .agents/ollama-superpowers-pack-v1.0.0/skills
nos_skill_resolver: .agents/nos-gallery-canonical-skills-205/manifest/skills.json
product_lifecycle_orchestration_resolver: .agents/product-lifecycle-canonical-skills-315/manifest/orchestrations.json
medusa_skill_root: .agents/skills/medusa
execution_protocol: .agents/canonical-execution-protocol.yaml
execution_adapters:
  dispatcher: .agents/fio-vivo-antigravity-rug-pack/.agents/agents/fio-vivo-rug/agent.md
  worker: .agents/fio-vivo-antigravity-rug-pack/.agents/agents/canonical-worker/agent.md
  reviewer: .agents/fio-vivo-antigravity-rug-pack/.agents/agents/canonical-reviewer/agent.md
contracts:
  session_state_ledger: .agents/contracts/session-state-ledger.md
  nos_gallery_first_fold: .agents/contracts/nos-gallery-first-fold.yaml
rules:
  - shortcuts never replace or fork canonical agents
  - specialist agents are capability profiles or independent validators
  - contracts and manifests are never counted as SKILL-E evidence
  - an available agent is not an executed agent
  - a present skill is not a consumed skill
  - actual execution must resolve exact paths and hashes into AGENT-E and SKILL-E
  - only one writer may own overlapping workspace surfaces
  - product approval, git authorization, PR authorization, merge authorization and release authorization are independent
  - human visual approval can never be inferred by automation
  - no SKILL-LOAD-E receipt means no SKILL-E
  - no completed AGENT-RUN receipt means no AGENT-E
  - no distinct reviewer route and invocation means no REVIEW-E
  - every execution claim must pass canonical execution evidence validation
shortcuts:
  orchestrate:
    canonical_agent: orchestrator
    core_skills: [issue-to-plan, structured-output, context-compaction, cost-governance]
  orchestrate:nos:
    canonical_agent: orchestrator
    specialist_agents:
      - .agents/fio-vivo-antigravity-rug-pack/.agents/agents/fio-vivo-rug/agent.md
    core_skills: [issue-to-plan, structured-output, context-compaction, cost-governance]
    orchestrations: [ORCH-02, ORCH-24]
    contracts: [session_state_ledger, nos_gallery_first_fold]
  repo:map:
    canonical_agent: repo-cartographer
    core_skills: [repo-map, dependency-audit]
  repo:guard:
    canonical_agent: repo-cartographer
    specialist_agents:
      - .agents/fio-vivo-antigravity-rug-pack/.agents/agents/repo-guardian/agent.md
    core_skills: [repo-map, dependency-audit]
    mode: read_only
  architect:
    canonical_agent: software-architect
    core_skills: [issue-to-plan, research-synthesis, dependency-audit, structured-output]
  architect:nos:
    canonical_agent: software-architect
    core_skills: [issue-to-plan, research-synthesis, dependency-audit, structured-output]
    orchestrations: [ORCH-02, ORCH-04, ORCH-13]
    nos_domains: [01-web-runtime, 03-data-contracts-forms, 06-interaction-visualization-ux, 08-quality-engineering]
    contracts: [nos_gallery_first_fold]
  impl:
    canonical_agent: implementation-engineer
    core_skills: [plan-to-patch, test-generation, debugging, documentation]
  impl:storefront:
    canonical_agent: implementation-engineer
    core_skills: [plan-to-patch, test-generation, debugging, documentation]
    external_skills:
      - .agents/skills/medusa/medusa-ecommerce-storefront-best-practices/SKILL.md
      - .agents/skills/medusa/medusa-dev-building-storefronts/SKILL.md
      - .agents/skills/web-design-guidelines/SKILL.md
    orchestrations: [ORCH-05]
    nos_domains: [01-web-runtime, 03-data-contracts-forms, 05-styles-themes-css, 06-interaction-visualization-ux]
  impl:medusa:
    canonical_agent: implementation-engineer
    core_skills: [plan-to-patch, test-generation, debugging, dependency-audit]
    external_skills:
      - .agents/skills/medusa/medusa-dev-building-with-medusa/SKILL.md
    orchestrations: [ORCH-13]
  impl:nos:
    canonical_agent: implementation-engineer
    core_skills: [plan-to-patch, test-generation, debugging, regression-attribution]
    external_skills:
      - .agents/skills/web-design-guidelines/SKILL.md
    orchestrations: [ORCH-05]
    nos_domains: [01-web-runtime, 03-data-contracts-forms, 04-radix-ui, 05-styles-themes-css, 06-interaction-visualization-ux, 08-quality-engineering]
    contracts: [nos_gallery_first_fold]
  css:spec:
