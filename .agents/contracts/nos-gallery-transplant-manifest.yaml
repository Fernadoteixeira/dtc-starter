# NOS-Gallery Transplant Manifest — BB-00 (Issue #13 / NOS-001)
# Status: REMEDIATION REVIEW. The canonical source SHA is pinned, but the
# transplant manifest remains mutable until T18-T23 evidence reconciliation and
# independent review pass. Subsequent issues must not treat it as frozen yet.

manifest:
  id: nos-gallery-transplant-manifest
  issue: BB-00 / NOS-001 (GitHub Issue #13)
  frozen_at: null
  gate_verdict: REMEDIATION_REVIEW_PENDING
  runtime_code_changes: none   # audit + mapping only, per issue scope

canonical_source:
  repository: Fernadoteixeira/nos-gallery
  remote_url: https://github.com/Fernadoteixeira/nos-gallery.git
  pinned_commit: 2b6eb782c5df5e78ed63fc4ad58d66487f2a7f6e
  pinned_commit_subject: "feat: initialize product-lifecycle-canonical-skills-315 agent with domain-specific skills, schemas, and orchestrations"
  pinned_commit_date: "2026-08-04T16:56:43-03:00"
  local_mirror: apps/storefront/src/modules/nos-gallery   # nested git repo
  verification:
    sha_match: true
    scope_files_clean_at_head: true   # git diff --name-only HEAD over scope files: empty
    working_tree_exceptions:
      - path: AGENTS.md               # local doc edit, outside transplant scope
      - path: .turbo/                 # untracked build cache
  lineage_note: >
    .agents/contracts/nos-gallery-first-fold.yaml cites reference.source
    "boldfernando/nos-gallery"; the actual local remote is
    "Fernadoteixeira/nos-gallery". The pinned SHA exists locally, matches the
    task canonical, and all scope files are byte-identical to HEAD. The pinned
    SHA — not the org name — is authoritative for this slice.

targets:
  presentation_package: packages/gallery-experience/**
  storefront_integration: apps/storefront/src/modules/home/gallery-hero/**

owners:
  presentation-package:
    domain: "@dtc/gallery-experience components, scoped CSS, domain contracts"
    paths: ["packages/gallery-experience/src/**"]
  storefront-integration:
    domain: "Next.js home hero wiring, feature flags, fixtures, fallback"
    paths: ["apps/storefront/src/modules/home/gallery-hero/**"]
  commerce-adapter:
    domain: "Medusa StoreProduct -> GalleryItem mapping, data fetching"
    paths:
      - apps/storefront/src/modules/home/gallery-hero/medusa-adapter.ts
      - apps/storefront/src/modules/home/gallery-hero/gallery-hero-data.ts
  qa-visual:
    domain: "Playwright baselines, nos-gallery-first-fold gate, reduced-motion checks"
    paths: ["docs/artifacts/**", "playwright.config.ts"]

