behavioral_contracts:
  active_index:
    - orchestrator owns currentIndex and initializes from a clamped initialItemHandle
    - next and previous wrap; direct selection clamps
    - keyboard handles ArrowLeft, ArrowRight, Home and End only while gallery focus is contained
    - editing targets, modifier keys and open overlays disable gallery keyboard handling
  scenes:
    - ArtworkCard owns activeScene and a ref mirror
    - pointer selection uses the canonical 2x2 grid and 0.08 dead band
    - thumbnail hover and click remain available on all pointers
    - discovery requires active, loaded and unobscured dwell for 650ms
  interaction:
    - drag uses resistance 0.4, viewport threshold 0.08, velocity threshold 0.3 and canonical momentum easing
    - wheel uses dominant axis, resistance 0.3, threshold 120, idle reset 150ms and passive false
    - interactive descendants never initiate drag or wheel hijacking
  ambient:
    - canonical keyed crossfade and gradient recipe are preserved
    - grain, vignette and reflection stay below interactive content and are aria-hidden
    - validated product ambient colors may be used when present
    - canonical DEFAULT_COLORS are a presentational fallback only; they are never serialized or claimed as product metadata
  progress:
    - snapshot is versioned, immutable, corruption-safe and storage-event synchronized
    - discovery keys use item handle plus scene id
    - dialogs pause dwell/discovery and resume is deterministic
  reduced_motion:
    - motion resolves to zero duration
    - pointer tracking, parallax, scene light, shimmer and grain animation are disabled
    - scene discovery remains reachable by explicit controls
  cta:
    - desktop and mobile retain canonical placement and minimum 44px target
    - action uses a validated localized GalleryItem.productUrl and emits onProductIntent
    - canonical inquiry pipeline is not transplanted

medusa_invariants:
  - fio-vivo collection lookup fails closed
  - collection missing, empty, API unavailable, partial failure and all-ineligible remain distinguishable
  - fixtures require an explicit policy and can never silently substitute production commerce data
  - title, handle, image, currency and calculated price are required for commercial eligibility
  - no invented currency, amount, artist, year, image, ambient metadata or availability
  - multi-variant pricing and inventory/backorder policy are deterministic and tested
  - countryCode and region context are preserved
  - StoreProduct to GalleryItem mapping is pure where practical and runtime-validates metadata

