      Upstream is the interactive orchestrator (active index, dialogs, progress,
      track translation, preload, editorial zones). Current DTC GalleryExperience
      is a static three-card slice that must be REPLACED by the ported
      orchestrator. Adaptations: Artwork -> GalleryItem contracts; initialArtworkCode
      -> initialItemHandle; artworkImageUrl -> direct GalleryImage.url; Analytics.*
      -> GalleryExperienceProps callbacks (onItemView/onSceneView/onProductIntent);
      hardcoded pt-BR copy -> i18n dictionary; sonner toasts and dynamic dialog
      imports dropped in wave 1 (see DEFER/REJECT entries).

  - upstream: components/artwork-card.tsx
