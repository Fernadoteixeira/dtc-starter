# ---------------------------------------------------------------------------
# 2. Behavioral contracts (binding for the port)
# ---------------------------------------------------------------------------
behavioral_contracts:

  active_index_management:
    source: hooks/use-slider-navigation.ts + components/art-gallery-slider.tsx
    rules:
      - currentIndex state owned by the orchestrator; initialized from initialItemHandle (clamped, 0 when unknown).
      - goToNext/goToPrev wrap modulo items.length; goToSlide clamps to [0, length-1].
      - Keyboard: ArrowRight/ArrowLeft/Home/End, ignored while editing (input/textarea/select/contenteditable), with modifier keys, or when a dialog/overlay is open.
      - Keyboard listener MUST be scoped to the gallery viewport focus (BB03 forbidden: global_keyboard_listener_without_focus_scope) — intentional deviation from upstream window listener.
      - Adjacent artwork's first scene image is preloaded on every index change (new window.Image()).

  scene_state_and_discovery:
    source: components/artwork-card.tsx
    rules:
      - Per-card activeScene index with ref mirror (activeSceneRef) to avoid stale closures.
      - Pointer-driven scene selection only when item is interactive AND fine pointer AND NOT reduced motion: card rect split into 2x2 grid, both |x| and |y| must exceed SCENE_DEAD_BAND 0.08 to switch.
      - Thumbnail click/hover sets scene directly and is available on all pointers.
      - External scene selection (progress map, wave 2) flows through a {itemHandle, sceneId, requestId} intent consumed exactly once by the active card.
      - Scene discovery fires onSceneView after SCENE_DISCOVERY_DELAY_MS 650ms of the active, loaded, discovery-enabled scene (wave 1: analytics callback only; persistence deferred).
      - Pointer tracking drives parallax (PARALLAX_X 10 / PARALLAX_Y 8), rotation (ROTATE_X 4 / ROTATE_Y 5, transformPerspective 900) and a --scene-light-position radial glow, all via springs POINTER_SPRING {stiffness 180, damping 28, mass 0.75}.

  drag_and_wheel_interaction:
    source: hooks/use-slider-drag.ts + hooks/use-slider-wheel.ts
    rules:
      - Drag start ignored when the event target is inside button/a/input/textarea/select/[role=button]/contenteditable.
      - Raw delta resisted by DRAG_RESISTANCE 0.4; velocity tracked per frame.
      - Swipe commits when |dragX| > 8% of viewport width OR |velocity| > 0.3 px/ms; dragX always eases back to 0 with rAF (MOMENTUM_EASING 0.1, stop < 0.5px).
      - Wheel: dominant axis taken (|deltaX| vs |deltaY|), resisted by 0.3, accumulated; slide change at |acc| >= 120; accumulator resets after 150ms idle; listener is passive:false with preventDefault.
      - While dragging, track translation transitions run with duration 0.

  ambient_grain_vignette:
    source: components/gallery-ambient.tsx + app/globals.css (.gallery-grain/.gallery-vignette)
    rules:
      - Ambient layer keyed by active item id; crossfade + scale 1.08->1 in, 0.98 out; AMBIENCE_DURATION 0.8s with GALLERY_EASE.
      - Gradient recipe fixed: radial 18%/42% color0@42alpha, radial 83%/78% color1@35alpha, radial 50%/5% color2@24alpha over linear 120deg surface->ink->ink-deep.
      - Grain: SVG feTurbulence data-URI at opacity 0.14 soft-light + 105deg repeating-linear-gradient ::after at 0.15.
      - Vignette: radial ellipse transparent 42% -> rgba(8,7,5,0.32) (0.22 on mobile).
      - All three layers are aria-hidden and pointer-events-none; grain/vignette z-ordered above ambient, below content.

  progress_tracking:
    source: components/gallery-progress-control.tsx + lib/gallery-progress.ts
    wave_1_rules:
      - Header shows static counter NN / NN (padStart 2) — format fixed by BB-04 fixture contract, locale-independent.
      - onProgressChange callback fires with {currentIndex, totalItems, activeSceneId}.
    wave_2_rules:
      - localStorage snapshot (versioned, immutable, storage-event-synced); storage key MUST be re-namespaced off 'fio-vivo:gallery-progress:v1'.
      - Discovery keys ARTWORKHANDLE:sceneId; achievements announced via toast equivalent; resume targets first undiscovered scene.

  reduced_motion:
    source: hooks/use-reduced-motion.ts + app/globals.css
    rules:
      - Every motion transition resolves to {duration: 0} when prefers-reduced-motion.
      - Pointer scene tracking, parallax, rotation and scene-light are disabled (canTrackPointer false).
      - "CSS: grain animation, skeleton shimmer, state-progress animation and thumb/skip-link transitions disabled under @media (prefers-reduced-motion: reduce)."
      - Scene discovery still functions via thumbnails (no capability loss).

  cta_behavior:
    source: components/art-gallery-slider.tsx + components/artwork-card.tsx
    rules:
      - 'Desktop: "Conhecer a peça" button bottom-right (i18n: gallery.cta), min 44px target, hover/focus prefetch intent.'
      - 'Mobile: same CTA rendered below the active card only (md:hidden), AnimatePresence on active change.'
      - 'WAVE-1 DEVIATION: CTA navigates to GalleryItem.productUrl and fires onProductIntent — it does NOT open the details dialog or inquiry modal (both deferred/rejected).'
      - Keyboard help region (gallery-help) and aria-live announcement of "title — contextualName. By artist. Item N of M." retained.

# ---------------------------------------------------------------------------
# 3. Intentional deviations (each with evidence + rationale)
# ---------------------------------------------------------------------------
deviations:

  - id: data-source-medusa
    kind: medusa-adaptation
    upstream: lib/artworks/postgres-* + getGalleryArtworks
    dtc: gallery-hero-data.ts + medusa-adapter.ts
    evidence: "gallery-hero-data.ts queries the Medusa Store API (collection fio-vivo, fields *variants,*variants.calculated_price,*images,*categories); medusa-adapter.ts maps StoreProduct -> GalleryItem."
    rationale: DTC architecture forbids direct DB access from the storefront; Medusa owns product, price and inventory truth.

  - id: type-contract-gallery-item
    kind: medusa-adaptation
    upstream: "Artwork { id: number, code: string, scenes: ArtworkScene[{id: number, image: string}], availability: available|sold|reserved|commission, price?: string }"
    dtc: "GalleryItem { id: string, handle: string, scenes: GalleryScene[{id: string, image: GalleryImage}], availability: available|low-stock|out-of-stock|preorder|unavailable, price?: GalleryPrice, productUrl: string, ambientColors?: [c,c,c] }"
    evidence: packages/gallery-experience/src/types/index.ts
    rationale: Framework-agnostic domain contract is the package's public API; scene ids and item identity key off handle/strings, prices are structured, availability maps to inventory states.

  - id: cta-to-product-page
    kind: medusa-adaptation
    upstream: details dialog -> inquiry modal (bespoke pipeline)
    dtc: navigate productUrl + onProductIntent callback
    evidence: "medusa-adapter.ts builds /{countryCode}/products/{handle}; inquiry pipeline (components/inquiry-modal.tsx, lib/inquiries/**) rejected."
    rationale: Commerce intent must flow through Medusa product/cart/checkout; the bespoke inquiry back-office duplicates it.

  - id: ambient-colors-curated
    kind: visual-behavioral-deviation
    upstream: runtime canvas color extraction (use-color-extraction)
    dtc: GalleryItem.ambientColors from product metadata.gallery.ambientColors with DEFAULT_COLORS fallback
    evidence: "medusa-adapter.ts line ~118: ambientColors: metadata.ambientColors || ['#1a1a2e','#16213e','#0f3460']"
    rationale: "Curated colors are deterministic, SSR-friendly and avoid canvas/CORS cost. NOTE: the current adapter fallback is a blue palette that VIOLATES nos-gallery-first-fold forbidden.generic_saas_blue_palette — must be changed to the upstream DEFAULT_COLORS ['#4a382a','#2d2720','#171614'] during the port."

  - id: palette-restoration
    kind: visual-behavioral-deviation
    upstream: copper/umber/linen tokens (--gallery-accent #c88f68, --gallery-ink #1b1814, --gallery-paper #ede3d2, ...)
    dtc_current: "scoped slice uses generic blue (--dtc-gallery-accent #38bdf8, bg #090a0f)"
    evidence: packages/gallery-experience/src/styles/gallery-experience.css lines 1-15
    rationale: BB03 contract requires copper_umber_linen_palette and forbids generic_saas_blue_palette; the port replaces the token block wholesale with the upstream palette, re-scoped.

  - id: tailwind-v3-compat
    kind: medusa-adaptation   # platform adaptation
    upstream: "Tailwind v4 syntax (@import 'tailwindcss', @theme inline, text-(--gallery-paper), max-w-38.75)"
    dtc: Tailwind CSS v3 in apps/storefront
    evidence: AGENTS.md common-mistakes ("v4-only syntax breaks the build"); upstream app/globals.css lines 3-92.
    rationale: Storefront build toolchain is v3; all v4-only utilities are converted to v3 arbitrary properties (text-[var(--gallery-paper)], max-w-[38.75px]) during the port. The package's scoped CSS is plain CSS and unaffected.

  - id: keyboard-scope
    kind: visual-behavioral-deviation
    upstream: window-level keydown listener
    dtc: viewport-focus-scoped keyboard handling
    evidence: nos-gallery-first-fold.yaml forbidden.global_keyboard_listener_without_focus_scope
    rationale: The gallery lives inside a storefront page with commerce header/cart; a global listener would hijack storefront navigation.

  - id: framer-motion-dependency
    kind: medusa-adaptation   # dependency reconciliation
    upstream: framer-motion + sonner + lucide-react + next/dynamic dialogs
    dtc: "package.json of @dtc/gallery-experience already declares framer-motion 12.42.2 (dependency) and react/next as peers; storefront itself does NOT install framer-motion; lucide-react and sonner are not declared"
    evidence: packages/gallery-experience/package.json; AGENTS.md ("No Framer Motion or shadcn/ui are installed").
    rationale: "Motion primitives port behind the package boundary where framer-motion is declared. sonner is NOT ported — toasts become callback events. Icons: lucide-react must be added to the package or replaced with inline SVG during the port (decision recorded as residual gap)."

  - id: i18n-externalized
    kind: visual-behavioral-deviation
    upstream: hardcoded pt-BR strings throughout components
    dtc: i18n dictionary (resolveGalleryLocale/translateGallery) driven by countryCode
    evidence: packages/gallery-experience/src/i18n/dictionary.ts; gallery-hero-client.tsx maps countryCode -> locale.
    rationale: DTC storefront is multi-region; hardcoded strings would block localization. KEEP_DTC.

  - id: gamification-deferred
    kind: visual-behavioral-deviation
    upstream: localStorage progress map, achievements, resume, saved artworks
    dtc: wave 1 ships counter + analytics callbacks only
    evidence: dispositions DEFER entries above.
    rationale: First-fold visual/interaction parity is the BB-NOS gate; persistence/gamification is additive and lands in wave 2 with a re-namespaced storage key.

# ---------------------------------------------------------------------------
