[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-superpowers-pack"
version = "1.0.0"
description = "Safe multilingual agent capabilities for Ollama"
requires-python = ">=3.11"
dependencies = ["ollama>=0.5"]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ollama-superpowers = "ollama_superpowers.cli:main"
ollama-superpowers-doctor = "ollama_superpowers.doctor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
